<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazo 解谜</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            text-align: center;
        }
        .level-badge {
            display: inline-block;
            background: #2a2a2a;
            color: #aaa;
            font-size: 14px;
            padding: 4px 16px;
            border-radius: 20px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 20px;
            color: #fff;
        }
        .question {
            background: #0f0f0f;
            border-left: 4px solid #f0c040;
            padding: 16px 20px;
            border-radius: 4px;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.6;
            word-break: break-word;
            text-align: left;
        }
        .question .hint {
            color: #888;
            font-size: 14px;
            margin-top: 8px;
        }
        .reset-btn {
            margin-top: 30px;
            background: transparent;
            border: 1px solid #444;
            color: #888;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }
        .reset-btn:hover {
            border-color: #888;
            color: #ccc;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #444;
        }
        .celebrate {
            font-size: 24px;
            margin: 20px 0;
            color: #f0c040;
        }
        .celebrate .emoji {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        .url-hint {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
            border-top: 1px dashed #333;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container" id="app"></div>

    <script>
        // ---------- 关卡数据 ----------
        const levels = [
            { path: 'level-1',       title: '第一关', question: '进入第二关' },
            { path: 'level-2',       title: '第二关', question: '进入第伞关' },
            { path: 'level-umbrella',title: '第三关', question: '发光的水果' },
            { path: 'apple',         title: '第四关', question: '切了吃' },
            { path: 'huawei',        title: '第五关', question: 'rmoshbghh key github' },
            { path: 'levlnaazo',     title: '第六关', question: 'URL 不对劲' },
            { path: 'levelnazo',     title: '第七关', question: 'Backrooms' },
            { path: 'liminal',       title: '第八关', question: 'Technoblade Never Dies!' },
            { path: 'hypixel',       title: '第九关', question: '企鹅' },
            { path: 'qq',            title: '第十关', question: '聊天室、打游戏、各类社区' },
            { path: 'discord',       title: '第十一关', question: 'What's on Wikidot? (Please look at the URL now)' },
            { path: 'discond',       title: '第十二关', question: '云想衣裳花想容' },
            { path: 'revlon',        title: '第十三关', question: '·-- ···· ·- - / - ···· · / ···· · ·-·· ·-··' },
            { path: 'what-the-hell', title: '第十四关', question: 'RUN!' },
            { path: 'exclamation',   title: '终点', question: '这里是终点。恭喜通关！' }
        ];

        // ---------- 辅助函数 ----------
        function getCurrentPath() {
            let p = location.pathname.replace(/^\/|\/$/g, '');
            if (!p) p = 'level-1';
            return p;
        }

        function getLevelIndex(path) {
            return levels.findIndex(l => l.path === path);
        }

        function getMaxLevel() {
            const val = parseInt(localStorage.getItem('nazo_max_level'), 10);
            return isNaN(val) ? 0 : val;
        }

        function setMaxLevel(index) {
            localStorage.setItem('nazo_max_level', String(index));
        }

        function resetProgress() {
            localStorage.removeItem('nazo_max_level');
            location.href = '/level-1';
        }

        // ---------- 核心渲染 ----------
        function render() {
            const app = document.getElementById('app');
            const currentPath = getCurrentPath();
            const idx = getLevelIndex(currentPath);
            let maxLevel = getMaxLevel();

            // 1. 无效路径 → 重置到第一关
            if (idx === -1) {
                location.href = '/level-1';
                return;
            }

            // 2. 解锁逻辑
            if (idx > maxLevel + 1) {
                // 跳过太多 → 重置
                location.href = '/level-1';
                return;
            } else if (idx === maxLevel + 1) {
                // 正好是下一关 → 解锁！
                setMaxLevel(idx);
                maxLevel = idx; // 更新内存变量
            }
            // 否则 idx <= maxLevel，已解锁，正常显示

            const level = levels[idx];
            const isEnd = (level.path === 'liminal');

            // 构建 HTML
            let html = `
                <div class="level-badge">${level.title}</div>
                <h1>🔍 谜题</h1>
                <div class="question">
                    ${level.question}
                    ${level.path === 'apple' ? '<div class="hint">💡 提示：中国人都知道吧</div>' : ''}
                    ${level.path === 'levelnazo' ? '<div class="hint">💡 提示：好好想想 Backrooms 是啥</div>' : ''}
                </div>
                <div class="url-hint">
                    🔗 想想 Nazo Game 让你干什么<!-- 修改地址栏中的 <strong>路径名</strong> 进入下一关 -->
                </div>
            `;

            if (isEnd) {
                html += `
                    <div class="celebrate">
                        <span class="emoji">🎊</span>
                        恭喜你通关所有谜题！<br>
                        <span style="font-size:18px;color:#aaa;">Congratulations</span>
                    </div>
                    <button class="reset-btn" onclick="resetProgress()">🔁 重新挑战</button>
                    <div class="footer">—— 终点亦是起点 ——</div>
                `;
            } else {
                html += `
                    <button class="reset-btn" onclick="resetProgress()">🗑️ 重置进度</button>
                    <div class="footer">💡 提示：路径</div>
                `;
            }

            app.innerHTML = html;
        }

        // 页面加载执行
        render();
    </script>
</body>
</html>
